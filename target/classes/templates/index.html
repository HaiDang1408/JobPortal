<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý tin tuyển dụng</title>
        <th:block th:replace="base :: resources"></th:block>
    </head>
    <body>
        <div th:replace="base :: header"></div>

        <section class="container mt-4">
            <h2 class="text-center mb-4 text-uppercase fw-bold">Danh sách tin tuyển dụng</h2>
            
            <div class="d-flex justify-content-between mb-3">
                <a th:href="@{/admin/jobs}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Đăng tin mới
                </a>
            </div>

            <table class="table table-hover shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>Tiêu đề công việc</th>
                        <th>Ngành nghề</th>
                        <th>Mức lương</th>
                        <th>Hạn nộp</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="j: ${jobs}">
                        <td>
                            <strong th:text="${j.title}"></strong>
                        </td>
                        <td th:text="${j.category.name}"></td>
                        <td class="text-danger fw-bold" th:text="${j.salary} + ' VNĐ'"></td>
                        <td th:text="${#dates.format(j.deadline, 'dd/MM/yyyy')}"></td>
                        <td>
                            <a th:href="@{/admin/jobs/} + ${j.id}" class="btn btn-sm btn-info text-white">
                                <i class="bi bi-pencil-square"></i> Sửa
                            </a>
                            <button class="btn btn-sm btn-danger" 
                                    th:onclick="'deleteJob(\'' + @{/api/jobs/} + ${j.id} + '\')'">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(jobs)}">
                        <td colspan="5" class="text-center italic">Hiện chưa có tin tuyển dụng nào.</td>
                    </tr>
                </tbody>
            </table>
        </section>
        
        <div th:replace="base :: footer"></div>
        
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
