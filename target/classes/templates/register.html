<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành viên</title>
    <th:block th:replace="~{base :: resources}"></th:block>
</head>
<body>
    <div th:replace="~{base :: header}"></div>

    <section class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4 rounded bg-light border-0">
                    <h3 class="text-center text-success mb-4">ĐĂNG KÝ TÀI KHOẢN</h3>
                    
                    <form th:action="@{/register}" method="post" th:object="${user}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Họ</label>
                                <input type="text" th:field="*{firstName}" class="form-control" placeholder="Nguyễn" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tên</label>
                                <input type="text" th:field="*{lastName}" class="form-control" placeholder="Văn A" required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="abc@gmail.com" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="username123" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" th:field="*{password}" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" name="confirmPassword" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Bạn là:</label>
                            <select th:field="*{userRole}" class="form-select">
                                <option value="ROLE_CANDIDATE">Ứng viên (Tìm việc)</option>
                                <option value="ROLE_EMPLOYER">Nhà tuyển dụng (Đăng tin)</option>
                            </select>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg">Đăng ký ngay</button>
                        </div>
                    </form>

                    <div class="mt-3 text-center">
                        <span class="small">Đã có tài khoản? </span>
                        <a th:href="@{/login}" class="small text-decoration-none">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div th:replace="~{base :: footer}"></div>
</body>
</html>
